services:
  # Django REST API
  - type: web
    name: rush-republic-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn rush_republic.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: rush-republic-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false  # set after first deploy: the frontend service's URL, e.g. https://rush-republic-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"

  # React static site
  - type: web
    name: rush-republic-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false  # set to https://<rush-republic-backend>.onrender.com/api after the backend's first deploy
    routes:
      # React Router client-side routing -- every unmatched path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rush-republic-db
    plan: free
    databaseName: rush_republic
    user: rush_republic_user
